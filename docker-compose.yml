services:
  db:
    image: postgres:16-alpine
    container_name: starshelf-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: starshelf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starshelf"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: starshelf-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: starshelf-server
    restart: always
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/starshelf?schema=public
      JWT_SECRET: super-secret-docker-jwt-key-2026-starshelf
      COOKIE_SECRET: super-secret-docker-cookie-key-2026-starshelf
      CORS_ORIGIN: http://localhost
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: no-reply@starshelf.local
      CLIENT_URL: http://localhost
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: starshelf-client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
